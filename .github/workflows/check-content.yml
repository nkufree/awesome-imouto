name: Check character pages

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check character images and source credits
        run: ruby tools/check-character-images.rb
      - name: Build with repository base path
        run: bundle exec jekyll build --baseurl /awesome-imouto
        env:
          JEKYLL_ENV: production
